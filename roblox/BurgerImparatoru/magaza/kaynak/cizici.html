    const temel = new THREE.Matrix4().makeBasis(new THREE.Vector3(...R), new THREE.Vector3(...U), new THREE.Vector3(...N));
    const kay = new THREE.Matrix4().makeTranslation(N[0] * (sx / 2 + 0.03), N[1] * (sy / 2 + 0.03), N[2] * (sz / 2 + 0.03));
    mesh.matrixAutoUpdate = false; mesh.matrix.copy(cfMatris(p.cf)).multiply(kay).multiply(temel);
    scene.add(mesh);
  } else if (gui.tur === 'pano') {
    if (cek.panolar === false) continue;
    const wS = gui.size[0], hS = gui.size[2]; if (wS <= 0 || hS <= 0) continue;
    const t = guiDokusu(gui.el, wS, hS, 60);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, toneMapped: false, fog: true }));
    sp.position.set(...gui.yer); sp.scale.set(wS, hS, 1); scene.add(sp);
  }
}

// kamera
const kamera = new THREE.PerspectiveCamera(cek.fov || 45, W / H, 0.3, 8000);
kamera.position.set(...cek.goz); kamera.lookAt(hedef);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, kamera));
if (cek.ao !== 0) { const ao = new GTAOPass(scene, kamera, W, H); ao.updateGtaoMaterial({ radius: cek.aoYaricap ?? 1.6, distanceExponent: 1, thickness: 1, scale: 1, samples: 12 }); ao.blendIntensity = cek.ao ?? 0.9;
  const aoRender = ao.render.bind(ao);
  ao.render = (...a) => { const gizli = []; scene.traverse(o => { if ((o.isSprite || o.renderOrder < 0) && o.visible) { o.visible = false; gizli.push(o); } }); aoRender(...a); for (const o of gizli) o.visible = true; };
  composer.addPass(ao); }
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), cek.parlama ?? 0.35, 0.5, 0.95));
composer.addPass(new OutputPass());
const doy = new ShaderPass(HueSaturationShader); doy.uniforms.saturation.value = cek.doygunluk ?? 0.22; composer.addPass(doy);
const kon = new ShaderPass(BrightnessContrastShader); kon.uniforms.contrast.value = cek.kontrast ?? 0.08; kon.uniforms.brightness.value = cek.parlaklik ?? 0.0; composer.addPass(kon);
const vin = new ShaderPass(VignetteShader); vin.uniforms.offset.value = 1.05; vin.uniforms.darkness.value = cek.vinyet ?? 0.9; composer.addPass(vin);
composer.render();

// üst yazılar
const ust = document.getElementById('ust');
document.getElementById('kap').style.width = W + 'px'; document.getElementById('kap').style.height = H + 'px';
for (const y of (cek.yazilar || [])) { const d = document.createElement('div'); d.className = y.sinif || 'baslik'; d.innerHTML = y.html; Object.assign(d.style, y.stil || {}); ust.appendChild(d); }
await document.fonts.ready;
await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
document.title = 'HAZIR';
