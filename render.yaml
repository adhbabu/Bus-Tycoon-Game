# Render.com Blueprint: TikTok Canlı Futbol sunucusunu internette çalıştırır
# (iPhone'dan yayın için). Ayrıntı: tiktok-futbol/README.md → "Sadece iPhone ile yayın"
services:
  - type: web
    name: tiktok-futbol
    runtime: node
    rootDir: tiktok-futbol
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: TIKTOK_USER
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: AZURE_SPEECH_KEY   # isteğe bağlı: ücretsiz doğal spiker sesi (Azure F0)
        sync: false
      - key: AZURE_SPEECH_REGION
        value: westeurope
