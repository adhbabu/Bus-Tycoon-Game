<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Canlı Maç Oyna — profil logosu</title>
<!-- TikTok profil fotoğrafı (1080x1080). Üretmek için: node brand/uret.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: #070d17; }
  #logo {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background: radial-gradient(circle at 50% 38%, #1d4a6e 0%, #0e2238 45%, #070d17 80%);
  }
  /* arka planda soluk dev klasik top */
  #bg { position: absolute; left: -260px; top: -300px; width: 1600px; height: 1600px; opacity: .07; }
  /* TikTok daire kırpar: içteki altın halka dairenin kenarını çerçeveler */
  #ring { position: absolute; inset: 22px; border-radius: 50%; border: 10px solid #ffc531; box-shadow: 0 0 40px rgba(255,197,49,.35), inset 0 0 60px rgba(0,0,0,.5); }
  #ball { position: absolute; left: 50%; top: 120px; width: 360px; height: 360px; margin-left: -180px; transform: rotate(-12deg); filter: drop-shadow(0 22px 30px rgba(0,0,0,.6)); }
  .t {
    position: absolute; left: 0; right: 0; text-align: center;
    font-family: 'Kaushan Script', cursive; color: #fff; line-height: 1;
    text-shadow: 0 8px 0 rgba(0,0,0,.35), 0 0 40px rgba(255,197,49,.35);
    transform: rotate(-5deg);
  }
  #t1 { top: 500px; font-size: 186px; }
  #t2 { top: 685px; font-size: 186px; color: #ffc531; }
  #sw { position: absolute; left: 270px; top: 875px; width: 560px; height: 50px; transform: rotate(-5deg); }
  #live {
    position: absolute; left: 50%; top: 935px; transform: translateX(-50%);
    font-family: Oswald, sans-serif; font-weight: 700; font-size: 44px; letter-spacing: 4px; color: #fff;
    background: #e53935; border-radius: 14px; padding: 4px 22px; box-shadow: 0 8px 20px rgba(229,57,53,.5);
  }
  #live::before { content: ''; display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: #fff; margin-right: 14px; vertical-align: 6px; }
</style>
</head>
<body>
<div id="logo">
  <div id="bg"></div>
  <div id="ring"></div>
  <div id="ball"></div>
  <div class="t" id="t1">Canlı Maç</div>
  <div class="t" id="t2">Oyna</div>
  <svg id="sw" viewBox="0 0 560 50"><path d="M6 36 C 150 8, 360 4, 554 22" fill="none" stroke="#ffc531" stroke-width="12" stroke-linecap="round"/></svg>
  <div id="live">CANLI</div>
</div>
<script>
function classicBall(id, R = 100) {
  const d = Math.PI / 180, c = R;
  const at = (x, y, r, a) => [x + r * Math.cos(a), y + r * Math.sin(a)];
  const pent = (x, y, r, rot) => [0, 1, 2, 3, 4].map((j) => at(x, y, r, rot + j * 72 * d));
  const pts = (a) => a.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' ');
  const mid = pent(c, c, 0.3 * R, -90 * d);
  const Q = [0, 1, 2, 3, 4].map((i) => at(c, c, 0.56 * R, (-90 + 72 * i) * d));
  const outer = [0, 1, 2, 3, 4].map((i) => {
    const a = (-54 + 72 * i) * d;
    const [x, y] = at(c, c, 0.88 * R, a);
    return pent(x, y, 0.32 * R, a);
  });
  let ln = '';
  const L = (p, q) => { ln += `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}"/>`; };
  mid.forEach((p, i) => L(p, Q[i]));
  const all = outer.flat();
  const dist = (u, v) => Math.hypot(u[0] - v[0], u[1] - v[1]);
  Q.forEach((q) => all.slice().sort((u, v) => dist(u, q) - dist(v, q)).slice(0, 2).forEach((v) => L(q, v)));
  outer.forEach((pg) => [pg[1], pg[4]].forEach((v) => {
    const a = Math.atan2(v[1] - c, v[0] - c);
    L(v, at(c, c, R * 1.2, a));
  }));
  return `<svg viewBox="0 0 ${2 * R} ${2 * R}" width="100%" height="100%">
    <defs>
      <clipPath id="${id}c"><circle cx="${c}" cy="${c}" r="${R - 1}"/></clipPath>
      <radialGradient id="${id}s" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".65" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
    </defs>
    <g clip-path="url(#${id}c)">
      <circle cx="${c}" cy="${c}" r="${R}" fill="#f7f7f2"/>
      <g stroke="#8d949c" stroke-width="${(R * 0.03).toFixed(1)}" stroke-linecap="round">${ln}</g>
      <polygon points="${pts(mid)}" fill="#14161a"/>
      ${outer.map((pg) => `<polygon points="${pts(pg)}" fill="#14161a"/>`).join('')}
      <circle cx="${c}" cy="${c}" r="${R}" fill="url(#${id}s)"/>
    </g>
    <circle cx="${c}" cy="${c}" r="${R - 1}" fill="none" stroke="#0b0d10" stroke-width="${(R * 0.03).toFixed(1)}"/>
  </svg>`;
}

document.getElementById('ball').innerHTML = classicBall('pb');
document.getElementById('bg').innerHTML = classicBall('pg');
</script>
</body>
</html>
